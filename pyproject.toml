[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "contrail-runtime-tools"
version = "0.1.0"
description = "Local-first tools for capturing and comparing runtime behavior"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Contrail contributors" }]
dependencies = []

[project.scripts]
runtime = "runtime_tools.cli:main"
rundiff = "runtime_tools.rundiff.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/runtime_tools"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=8.3",
    "ruff>=0.9",
]
