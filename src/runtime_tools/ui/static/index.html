<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contrail Runtime Timeline</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <header class="masthead">
      <div>
        <p class="eyebrow">CONTRAIL / EXECUTION EVIDENCE</p>
        <h1>Runtime timeline</h1>
      </div>
      <div id="run-switcher" class="segmented" aria-label="Select execution"></div>
    </header>

    <main>
      <section id="summary" class="summary" aria-label="Execution summary"></section>

      <section id="comparison" class="comparison hidden" aria-label="Run comparison">
        <div class="section-heading">
          <div>
            <p class="eyebrow">STRUCTURED DIFF</p>
            <h2>Behavior changes</h2>
          </div>
        </div>
        <div id="comparison-grid" class="comparison-grid"></div>
      </section>

      <section class="timeline-shell">
        <div class="section-heading controls-heading">
          <div>
            <p class="eyebrow">OBSERVED INTERVALS</p>
            <h2>Execution lanes</h2>
          </div>
          <div class="controls">
            <label>Entity <select id="entity-filter"><option value="">All</option></select></label>
            <label>Kind <select id="kind-filter"><option value="">All</option></select></label>
            <label>Zoom <input id="zoom" type="range" min="1" max="8" step="0.5" value="1"></label>
          </div>
        </div>
        <div id="axis" class="axis"></div>
        <div id="timeline" class="timeline" tabindex="0" aria-label="Scrollable runtime timeline"></div>
      </section>
    </main>

    <aside id="detail" class="detail" aria-live="polite">
      <p class="eyebrow">SELECTED EVIDENCE</p>
      <h2>Choose an interval</h2>
      <p>Click a bar to inspect its normalized attributes and timing.</p>
    </aside>

    <script src="/app.js" defer></script>
  </body>
</html>
