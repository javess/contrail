name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          version: "0.12.3"
      - run: uv sync --locked
      - run: uv run python tools/check_architecture.py
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run ty check
      - run: uv run pytest
      - name: Run the pull-request performance gate
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: uv run python benchmarks/release.py --profile pr

  release-artifacts:
    needs: quality
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.release_identity.outputs.name }}
      version: ${{ steps.release_identity.outputs.version }}
      tag: ${{ steps.release_identity.outputs.tag }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          version: "0.12.3"
      - run: uv sync --locked
      - name: Validate release identity
        id: release_identity
        env:
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
        run: >-
          uv run python tools/release_check.py
          --ref-type "$RELEASE_REF_TYPE"
          --ref-name "$RELEASE_REF_NAME"
          --github-output "$GITHUB_OUTPUT"
      - name: Build twice from the commit timestamp
        run: |
          source_date_epoch="$(git log -1 --format=%ct)"
          echo "SOURCE_DATE_EPOCH=$source_date_epoch" >> "$GITHUB_ENV"
          export SOURCE_DATE_EPOCH="$source_date_epoch"
          mkdir dist-a dist-b
          uv build --out-dir dist-a
          uv build --out-dir dist-b
      - name: Verify reproducible artifact bytes
        run: |
          cmp dist-a/*.whl dist-b/*.whl
          cmp dist-a/*.tar.gz dist-b/*.tar.gz
          sha256sum dist-a/* | tee SHA256SUMS
      - name: Validate release archive contents
        run: |
          CONTRAIL_RELEASE_WHEEL="$(realpath dist-a/*.whl)" \
          CONTRAIL_RELEASE_SDIST="$(realpath dist-a/*.tar.gz)" \
          uv run pytest -q tests/package_metadata_test.py
      - name: Install and smoke-test the wheel
        run: |
          uv export --locked --no-dev --no-emit-project --no-hashes \
            --output-file release-constraints.txt
          uv run python tools/release_smoke.py \
            --constraints release-constraints.txt dist-a/*.whl
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: contrail-release-artifacts
          if-no-files-found: error
          path: |
            dist-a/*
            SHA256SUMS

  publish-pypi:
    if: github.ref_type == 'tag' && vars.PYPI_PUBLISH_REPOSITORY == github.repository
    needs: release-artifacts
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: contrail-release-artifacts
          path: release-artifacts
      - name: Verify qualified distribution checksums
        working-directory: release-artifacts
        run: sha256sum --check SHA256SUMS
      - name: Publish the qualified distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: release-artifacts/dist-a
          attestations: true

  publish-github:
    if: github.ref_type == 'tag' && vars.PYPI_PUBLISH_REPOSITORY == github.repository
    needs: [release-artifacts, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: contrail-release-artifacts
          path: release-artifacts
      - name: Publish the qualified distributions on GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release-artifacts
          sha256sum --check SHA256SUMS
          gh release create "$GITHUB_REF_NAME" dist-a/*.whl dist-a/*.tar.gz SHA256SUMS --verify-tag --generate-notes

  proofline:
    if: github.event_name == 'pull_request'
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
          version: "0.12.3"
      - run: uv sync --locked
      - name: Validate the example contract
        run: uv run contrail validate examples/local/contracts.yaml --format json
      - name: Evaluate the pull request runtime contract
        id: proofline_gate
        run: >-
          uv run contrail run examples/local/contracts.yaml
          --baseline-ref "${{ github.event.pull_request.base.sha }}"
          --candidate-ref "${{ github.event.pull_request.head.sha }}"
          --workload examples/local/pipeline.py
          --output-dir proofline-results
          --explain
          --format json
          --report proofline-report.json
      - name: Publish Proofline failure summary
        if: failure() && steps.proofline_gate.conclusion == 'failure'
        shell: bash
        run: |
          {
            echo '## Proofline runtime contract'
            echo
            if [[ -f proofline-results/baseline.runpack && -f proofline-results/candidate.runpack ]]; then
              {
                uv run contrail verify examples/local/contracts.yaml \
                  --baseline proofline-results/baseline.runpack \
                  --candidate proofline-results/candidate.runpack \
                  --explain 2>&1 || true
              } | sed 's/^/    /'
              echo
              echo 'Download the `proofline-evidence` artifact for the versioned JSON report and both runpacks.'
            else
              echo 'Proofline did not complete both captures. See the gate log for its diagnostic.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Proofline evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: proofline-evidence
          if-no-files-found: warn
          retention-days: 30
          path: |
            proofline-report.json
            proofline-results/*.runpack
