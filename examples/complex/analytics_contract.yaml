name: analytics-efficiency
description: Preserve the published dataset without per-row profile fan-out or write amplification.
assertions:
  - type: candidate_exit_success
    name: pipeline-completes
  - type: exit_code_equivalent
    name: exit-status-preserved
  - type: output_equivalent
    name: published-result-preserved
  - type: forbid_new_dependency
    name: no-raw-profile-api
    from: python
    to: raw-profile-api
  - type: max_operation_count
    name: bounded-warehouse-upserts
    operation: warehouse.upsert
    relative_to: baseline
    factor: 1.25
