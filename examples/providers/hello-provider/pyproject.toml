[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "contrail-hello-provider"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = ["contrail-runtime-tools>=0.9"]

[project.entry-points."contrail.providers"]
hello = "contrail_hello_provider:PROVIDER"

[tool.hatch.build.targets.wheel]
packages = ["src/contrail_hello_provider"]
